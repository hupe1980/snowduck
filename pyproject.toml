[project]
name = "snowduck"
version = "0.3.0"
description = "Run Snowflake SQL locally, powered by DuckDB - lightweight in-memory SQL engine for development and testing"
authors = [
    {name = "hupe1980"}
]
repository = "https://github.com/hupe1980/snowduck"
homepage = "https://github.com/hupe1980/snowduck"
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<4"
keywords = ["snowflake", "duckdb", "sql", "testing", "mock", "database", "data-engineering"]
dependencies = [
    "duckdb (>=1.2.1,<2.0.0)",
    # 3.17.0 dropped the connector's own pyarrow <19 pin (an Azure Batch
    # workaround). The upper bound has to admit 4.x: dbt-snowflake 1.12 requires
    # snowflake-connector-python >=4.2, so a <4 pin makes SnowDuck and current
    # dbt-snowflake uninstallable together.
    "snowflake-connector-python (>=3.17.0,<5.0.0)",
    # sqlglot[rs] is deprecated; sqlglot[c] is the current accelerator.
    # 30.x ships mypyc-compiled generators, which cannot be subclassed from
    # Python - SnowDuck customises Dialect.generate() instead.
    "sqlglot[c] (>=30.18.0,<31.0.0)",
    # Must stay unpinned at the top end: pyarrow <19 ships no cp314 wheels, so a
    # <19 pin makes `pip install snowduck` fall back to a source build on Python 3.14.
    "pyarrow (>=18.0.0)",
]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Database",
]

[project.scripts]
snowduck = "snowduck.server.server:main"

[project.optional-dependencies]
server = [
    "starlette>=0.46.1",
    "uvicorn>=0.34.0",
    "zstandard>=0.23.0",  # Required for SDK InsertRows mode (zstd compression)
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=6.0.0",
    "ruff>=0.11.2",
    "mypy>=1.15.0",
    "jupyter>=1.1.1",
    "pyarrow-stubs>=17.19",
    "pandas-stubs>=2.2",
    "numpy>=2.2.4",
    "pandas>=2.2.3",
    "pytest-asyncio>=0.26.0",
    "starlette>=0.46.1",
    "uvicorn>=0.34.0",
    "zstandard>=0.23.0",  # Required for SDK InsertRows mode (zstd compression)
    "snowpipe-streaming>=1.1.0",
    "dbt-snowflake>=1.12.0",  # For dbt compatibility tests
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
# Specify the target Python version
target-version = "py311"

# Enable autofix for certain rules
fix = true

# Exclude specific directories or files
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
]

[tool.ruff.lint]
# Enable specific linting rules
select = [
    "E",  # Pycodestyle errors
    "F",  # Pyflakes errors
    "I",  # Import-related errors
    "B",  # Bugbear rules
]

# Ignore specific rules
ignore = [
    "E501",  # Ignore line length errors
]

# Add per-file-ignores if needed
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S101"]  # Ignore docstring and security checks in test files

[tool.pytest.ini_options]
asyncio_mode = "strict"
markers = [
    "integration: marks tests as integration tests that require manual run (deselect with '-m \"not integration\"')",
]
